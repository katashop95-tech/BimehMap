<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یافتن رستوران‌های اطراف من</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Tahoma, sans-serif; }

#map {
width: 100%;
height: 100vh;
}

/* پنل کنترل بالای نقشه */
.control-panel {
position: absolute;
top: 10px;
right: 10px;
z-index: 1000;
background: white;
padding: 12px;
border-radius: 8px;
box-shadow: 0 2px 8px rgba(0,0,0,0.2);
display: flex;
flex-direction: column;
gap: 8px;
min-width: 220px;
}

.control-panel label {
font-size: 13px;
font-weight: bold;
color: #333;
}

.control-panel input[type="range"] {
width: 100%;
}

.control-panel .radius-value {
font-size: 12px;
color: #666;
text-align: center;
}

.control-panel button {
background: #e74c3c;
color: white;
border: none;
padding: 8px;
border-radius: 6px;
cursor: pointer;
font-size: 13px;
}

.control-panel button:hover {
background: #c0392b;
}

/* لیست رستوران‌ها */
.restaurant-list {
position: absolute;
bottom: 10px;
right: 10px;
z-index: 1000;
background: white;
border-radius: 8px;
box-shadow: 0 2px 8px rgba(0,0,0,0.2);
max-height: 40vh;
width: 280px;
overflow-y: auto;
padding: 10px;
}

.restaurant-list h3 {
font-size: 14px;
margin-bottom: 8px;
color: #333;
border-bottom: 1px solid #eee;
padding-bottom: 6px;
}

.restaurant-item {
padding: 8px;
border-bottom: 1px solid #f0f0f0;
cursor: pointer;
border-radius: 4px;
transition: background 0.2s;
}

.restaurant-item:hover {
background: #f9f9f9;
}

.restaurant-item .name {
font-weight: bold;
font-size: 13px;
color: #222;
}

.restaurant-item .info {
font-size: 11px;
color: #777;
margin-top: 3px;
}

.restaurant-item .distance {
color: #e74c3c;
font-weight: bold;
}

/* استایل مارکر سفارشی */
.custom-marker {
background: #e74c3c;
width: 20px;
height: 20px;
border-radius: 50%;
border: 3px solid white;
box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

.user-marker {
background: #3498db;
width: 22px;
height: 22px;
border-radius: 50%;
border: 4px solid white;
box-shadow: 0 0 0 4px rgba(52,152,219,0.3), 0 2px 6px rgba(0,0,0,0.4);
animation: pulse 2s infinite;
}

@keyframes pulse {
0% { box-shadow: 0 0 0 4px rgba(52,152,219,0.4); }
70% { box-shadow: 0 0 0 20px rgba(52,152,219,0); }
100% { box-shadow: 0 0 0 4px rgba(52,152,219,0); }
}
</style>
</head>
<body>

<div id="map"></div>

<!-- پنل کنترل -->
<div class="control-panel">
<label>شعاع جستجو: <span id="radiusLabel">3</span> کیلومتر</label>
<input type="range" id="radiusSlider" min="1" max="20" value="3" step="1">
<button id="locateBtn">📍 موقعیت من</button>
</div>

<!-- لیست رستوران‌ها -->
<div class="restaurant-list">
<h3>رستوران‌های اطراف (<span id="count">0</span>)</h3>
<div id="listContainer"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ⚠️ اینجا لینک CSV خودتان را جایگزین کنید
const SHEET_CSV_URL = "YOUR_GOOGLE_SHEET_CSV_URL_HERE";

// ====== متغیرهای سراسری ======
let map;
let userMarker = null;
let radiusCircle = null;
let restaurantMarkers = [];
let allRestaurants = [];
let userPosition = null;
let currentRadius = 3; // کیلومتر

// ====== ۱. راه‌اندازی نقشه ======
function initMap() {
map = L.map('map').setView([35.6892, 51.3890], 11); // پیش‌فرض: تهران

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19,
attribution: '© OpenStreetMap'
}).addTo(map);
}

// ====== ۲. محاسبه فاصله (Haversine) ======
function getDistanceKm(lat1, lng1, lat2, lng2) {
const R = 6371;
const dLat = (lat2 - lat1) * Math.PI / 180;
const dLng = (lng2 - lng1) * Math.PI / 180;
const a =
Math.sin(dLat / 2) ** 2 +
Math.cos(lat1 * Math.PI / 180) *
Math.cos(lat2 * Math.PI / 180) *
Math.sin(dLng / 2) ** 2;
return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ====== ۳. تبدیل CSV به آرایه ======
function parseCSV(csvText) {
const lines = csvText.trim().split('\n');
const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$`/g, ''));

return lines.slice(1).map(line => {
// پارس ساده CSV (اگر کاما داخل مقدار باشد، نیاز به پارسر قوی‌تر دارید)
const values = line.match(/(".?"|[^",]+)(?=\s,|\s*$)/g) || []; const obj = {}; headers.forEach((header, i) =&gt; { let val = (values[i] || '').trim().replace(/^"|"$/g, '');
obj[header] = val;
});
return {
name: obj.name,
lat: parseFloat(obj.lat),
lng: parseFloat(obj.lng),
address: obj.address || '',
category: obj.category || '',
phone: obj.phone || ''
};
}).filter(r => !isNaN(r.lat) && !isNaN(r.lng));
}

// ====== ۴. خواندن داده‌ها از Google Sheets ======
async function loadRestaurants() {
try {
const res = await fetch(SHEET_CSV_URL);
const csv = await res.text();
allRestaurants = parseCSV(csv);
console.log(✅${allRestaurants.length} رستوران بارگذاری شد`);
} catch (err) {
console.error('❌ خطا در بارگذاری داده‌ها:', err);
alert('خطا در بارگذاری داده‌ها. لینک CSV را بررسی کنید.');
}
}

// ====== ۵. گرفتن موقعیت کاربر ======
function locateUser() {
if (!navigator.geolocation) {
alert('مرورگر شما از Geolocation پشتیبانی نمی‌کند');
return;
}

navigator.geolocation.getCurrentPosition(
(pos) => {
userPosition = {
lat: pos.coords.latitude,
lng: pos.coords.longitude
};
onUserLocated();
},
(err) => {
let msg = 'خطا در دریافت موقعیت: ';
if (err.code === 1) msg += 'دسترسی رد شد';
else if (err.code === 2) msg += 'موقعیت در دسترس نیست';
else if (err.code === 3) msg += 'زمان انتظار تمام شد';
alert(msg);
},
{ enableHighAccuracy: true, timeout: 10000 }
);
}

// ====== ۶. بعد از پیدا شدن موقعیت کاربر ======
function onUserLocated() {
const { lat, lng } = userPosition;

// پاک کردن مارکر قبلی کاربر
if (userMarker) map.removeLayer(userMarker);
if (radiusCircle) map.removeLayer(radiusCircle);

// مارکر کاربر
userMarker = L.marker([lat, lng], {
icon: L.divIcon({
className: 'user-marker',
iconSize: [22, 22],
iconAnchor: [11, 11]
})
}).addTo(map).bindPopup('📍 شما اینجا هستید');

// دایره شعاع
radiusCircle = L.circle([lat, lng], {
radius: currentRadius * 1000,
color: '#3498db',
fillColor: '#3498db',
fillOpacity: 0.1,
weight: 2,
dashArray: '5,5'
}).addTo(map);

// زوم روی موقعیت کاربر
map.setView([lat, lng], 14);

// نمایش رستوران‌های نزدیک
showNearbyRestaurants();
}

// ====== ۷. نمایش رستوران‌های داخل شعاع ======
function showNearbyRestaurants() {
// پاک کردن مارکرهای قبلی
restaurantMarkers.forEach(m => map.removeLayer(m));
restaurantMarkers = [];

if (!userPosition) return;

const { lat, lng } = userPosition;

// فیلتر کردن رستوران‌های داخل شعاع
const nearby = allRestaurants
.map(r => ({
...r,
distance: getDistanceKm(lat, lng, r.lat, r.lng)
}))
.filter(r => r.distance <= currentRadius)
.sort((a, b) => a.distance - b.distance);

// اضافه کردن مارکرها
nearby.forEach(r => {
const marker = L.marker([r.lat, r.lng], {
icon: L.divIcon({
className: 'custom-marker',
iconSize: [20, 20],
iconAnchor: [10, 10]
})
}).addTo(map);

marker.bindPopup(&lt;div style="font-family: Tahoma; direction: rtl; text-align: right; min-width: 180px;"&gt; &lt;strong style="font-size: 14px;"&gt;${r.name}</strong><br>
<span style="color: #777; font-size: 12px;">${r.address}&lt;/span&gt;&lt;br&gt; &lt;span style="color: #e74c3c; font-size: 12px;"&gt;فاصله: ${r.distance.toFixed(2)} کیلومتر</span>
${r.phone ?<br><span style="font-size: 12px;">☎️ ${r.phone}&lt;/span> : ''}
</div>
`);

restaurantMarkers.push(marker);
});

// بروزرسانی لیست
updateList(nearby);
}

// ====== ۸. بروزرسانی لیست کنار نقشه ======
function updateList(restaurants) {
const container = document.getElementById('listContainer');
document.getElementById('count').textContent = restaurants.length;

if (restaurants.length === 0) {
container.innerHTML = '<p style="font-size:12px; color:#999; text-align:center; padding:10px;">رستورانی در این محدوده پیدا نشد</p>';
return;
}

container.innerHTML = restaurants.map((r, i) => &lt;div class="restaurant-item" data-lat="${r.lat}" data-lng="{r.name}</div>
<div class="info">{r.distance.toFixed(2)} کیلومتر</span></div>
</div>
`).join('');

// کلیک روی هر آیتم، نقشه را به آن نقطه می‌برد
container.querySelectorAll('.restaurant-item').forEach(el => {
el.addEventListener('click', () => {
const lat = parseFloat(el.dataset.lat);
const lng = parseFloat(el.dataset.lng);
map.setView([lat, lng], 16);
});
});
}

// ====== ۹. راه‌اندازی رویدادها ======
function setupEvents() {
// دکمه موقعیت من
document.getElementById('locateBtn').addEventListener('click', locateUser);

// اسلایدر شعاع
const slider = document.getElementById('radiusSlider');
slider.addEventListener('input', (e) => {
currentRadius = parseInt(e.target.value);
document.getElementById('radiusLabel').textContent = currentRadius;

if (userPosition) {
// بروزرسانی دایره
radiusCircle.setRadius(currentRadius * 1000);
// بروزرسانی رستوران‌ها
showNearbyRestaurants();
}
});
}

// ====== ۱۰. شروع برنامه ======
(async function main() {
initMap();
setupEvents();
await loadRestaurants();
// به‌صورت خودکار موقعیت کاربر را بگیر
locateUser();
})();
</script>

</body>
</html>
